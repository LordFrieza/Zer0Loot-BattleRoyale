<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arène — Zer0Loot Battle Royale</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="obs">
  <!-- Page plein écran à utiliser comme « Source navigateur » dans OBS (1280×720 ou 1920×1080). -->
  <div class="arena-wrap"><canvas id="arena"></canvas>
    <!-- Tchat du site en transparence, dans un coin (les messages s'effacent seuls). ?tchat=0 pour le masquer. -->
    <div id="arena-chat" class="arena-chat"></div></div>
  <!-- Visible seulement si le navigateur bloque le son (dans OBS, le son démarre tout seul). -->
  <button id="sound-unlock" class="secondary small" style="position:fixed;right:12px;bottom:12px;display:none">🔇 Cliquer pour activer le son</button>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/rules.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/fighter.js"></script>
  <script src="/js/monsters.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/arena-themes.js"></script>
  <script src="/js/arena.js"></script>
  <script src="/js/emotes.js"></script>
  <script src="/js/chat.js"></script>
  <script>
    const socket = io();
    const view = new ArenaView(document.getElementById('arena'), socket);
    const params = new URLSearchParams(location.search);
    /*
     * Joueur connecté : encart personnel (vie, ultime) en bas à droite et repère « TOI » (?hud=0 pour les masquer),
     * vote au sondage en cliquant sur les cartes, et barre de saisie 💬 dans le tchat incrusté. Sans compte (OBS) :
     * l'arène reste en lecture seule.
     */
    let me = null;
    fetch('/api/me').then((r) => (r.ok ? r.json() : null)).catch(() => null).then((data) => {
      if (data && data.role === 'player' && data.id) {
        me = data;
        if (params.get('hud') !== '0') view.meKey = 'u' + me.id;
        view.voteEnabled = true;
        view.onVote = (choice, kind) => (kind === 'diff' ? api('/api/boss/difficulty', { difficulty: choice }) : api('/api/poll/vote', { choice }));
      }
      if (params.get('tchat') !== '0') {
        Chat.mount(document.getElementById('arena-chat'), 'overlay', { input: !!me });
        Chat.init(socket, { name: () => me && (me.twitchDisplayName || me.username), id: () => me && me.id });
      } else document.getElementById('arena-chat').remove();
    });
    // Sondage affiché : le tchat incrusté se fait discret pour laisser voir les cartes
    setInterval(() => { const el = document.getElementById('arena-chat'); if (el) el.classList.toggle('poll-open', !!view.pollHit); }, 300);
    const unlockBtn = document.getElementById('sound-unlock');
    const refreshUnlock = () => { unlockBtn.style.display = Sound.blocked && !Sound.muted ? '' : 'none'; };
    unlockBtn.onclick = () => setTimeout(refreshUnlock, 100);
    Sound.onStateChange(refreshUnlock);
    setTimeout(refreshUnlock, 500);
  </script>
</body>
</html>
