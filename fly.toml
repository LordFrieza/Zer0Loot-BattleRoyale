# Configuration Fly.io : le jeu tourne 24 h/24 sur UNE machine, avec la base sur un volume permanent.
# Guide pas à pas : DEPLOIEMENT.md

# Nom de l'application : il doit être unique sur tout Fly.io. S'il est déjà pris, choisis-en un autre
# (ex. « zer0loot-br-2 ») et remplace-le ici ; l'adresse du site sera https://<nom>.fly.dev
app = "zer0loot-battleroyale"
primary_region = "cdg" # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  TWITCH_CHANNEL = "zer0loot"
  # Les autres réglages (mot de passe admin, adresse publique, clés Twitch) sont des secrets : `fly secrets set …`

# Disque permanent : comptes, personnages, loot (db.json). À créer une fois avec `fly volumes create zer0loot_data`.
[[mounts]]
  source = "zer0loot_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Jamais d'arrêt automatique : le serveur doit lire le chat Twitch en permanence et garde la bataille en mémoire.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    # Les pages restent connectées en WebSocket (Socket.IO) : on compte les connexions, pas les requêtes.
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

# Redémarre toujours la machine si le serveur s'arrête (vérifiable avec `fly machine status -d`).
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
