# fly.toml app configuration file generated for minilooteur on 2026-11-04T15:24:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'minilooteur'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  TWITCH_CHANNEL = 'zer0loot'

[[mounts]]
  source = 'zer0loot_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
